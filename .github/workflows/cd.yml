name: CD - deploy EC2
on:
  workflow_run:
    workflows: ["CI - tests and image"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: read
# Nunca executar dois deploys ao mesmo tempo na mesma instancia.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    # Only successful CI runs started by pushes to main.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    # Runner auto-hospedado dentro da VPC (na propria EC2), executando como usuario
    # sem privilegios (fora do grupo docker, sem sudo) e com conexao somente de saida
    # para o GitHub. Assim a porta 22 nao precisa ser aberta para os IPs variaveis dos
    # runners hospedados do GitHub (nem para 0.0.0.0/0). O SSH com chave dedicada e
    # known_hosts validado continua sendo a fronteira de privilegio ate o usuario
    # que controla o Docker.
    runs-on: [self-hosted, linux, x64, ec2-deploy]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up SSH credentials and verify host identity
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          # Credenciais ficam no diretorio temporario do job (removido ao final),
          # nao no ~/.ssh persistente do runner.
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Deploy immutable image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          # Repositorio privado => pacote GHCR privado. O GITHUB_TOKEN do job (somente
          # packages:read, expira ao fim do job) e enviado pela entrada padrao do SSH,
          # usado no docker login e removido com docker logout apos o deploy.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${DEPLOY_SHA}"
          test -n "$EC2_HOST" && test -n "$EC2_USER"
          # Expected values are host/user, not arbitrary SSH options.
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]]
          echo "Implantando ${IMAGE}"
          { printf '%s\n' "$GHCR_TOKEN"; cat scripts/deploy.sh; } | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -i "$RUNNER_TEMP/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              "${EC2_USER}@${EC2_HOST}" \
              "read -r T && printf '%s\n' \"\$T\" | docker login ghcr.io -u '${GHCR_USER}' --password-stdin >/dev/null && unset T && bash -s -- '${IMAGE}'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
      - name: Verify remote endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: curl --fail --show-error --retry 10 --retry-delay 3 "http://${EC2_HOST}/health"
      - name: Remove SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"

  verify-public:
    # Checagem externa, a partir de um runner hospedado do GitHub (internet),
    # confirmando /health e que /version responde exatamente o SHA implantado.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check public /health and deployed version
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$PUBLIC_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          curl --fail --show-error --retry 10 --retry-delay 3 "http://${PUBLIC_HOST}/health"
          echo
          VERSION=$(curl --fail --show-error --silent "http://${PUBLIC_HOST}/version" | jq -r .version)
          echo "Versao publicada: ${VERSION}"
          test "$VERSION" = "$DEPLOY_SHA"
